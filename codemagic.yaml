      - name: Weekly practical exam and diagnosis checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/weekly_exam_quality_check.py

      - name: Shadowing three-pass training-room checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/shadowing_training_quality_check.py

      - name: Personal weak-word micro-reading checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/weak_word_story_quality_check.py

      - name: Real-life 36-stage task map checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/life_task_map_quality_check.py

      - name: Four-track personal forgetting model checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/personal_forgetting_model_quality_check.py

      - name: Beginner-first simple home and progressive unlock checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/beginner_home_quality_check.py

      - name: Permanent signing configuration checks
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/signing_config_check.py

      - name: Strict release gate
        script: |
          cd "$CM_BUILD_DIR"
          python3 tools/release_gate.py

      - name: Verify permanent signing identity
        script: |
          cd "$CM_BUILD_DIR"
          test -n "$CM_KEYSTORE_PATH" || { echo "ERROR: CM_KEYSTORE_PATH missing. Upload/reference zhongxue_release in Codemagic."; exit 1; }
          test -n "$CM_KEYSTORE_PASSWORD" || { echo "ERROR: CM_KEYSTORE_PASSWORD missing."; exit 1; }
          test -n "$CM_KEY_ALIAS" || { echo "ERROR: CM_KEY_ALIAS missing."; exit 1; }
          test -n "$CM_KEY_PASSWORD" || { echo "ERROR: CM_KEY_PASSWORD missing."; exit 1; }
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" > signing-fingerprint.txt
          echo "===== SIGNING CERTIFICATE ====="
          grep -E "Alias name:|SHA256:" signing-fingerprint.txt || true
          EXPECTED_SHA256=$(tr -d '\r\n ' < signing-certificate-sha256.txt)
          ACTUAL_SHA256=$(grep -m1 "SHA256:" signing-fingerprint.txt | sed 's/^[[:space:]]*SHA256:[[:space:]]*//' | tr -d '\r\n ')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Wrong Android signing certificate. Expected $EXPECTED_SHA256 but got $ACTUAL_SHA256"
            exit 1
          fi
          echo "Permanent signing fingerprint verified."

      - name: Build signed release APK
        script: |
          cd "$CM_BUILD_DIR"
          # Generate a monotonically increasing Android versionCode from UTC epoch.
          # Offset keeps the value far below Android's maximum while every later
          # Codemagic build remains newer than the previous one.
          NOW=$(date -u +%s)
          UPDATE_VERSION_CODE=$((NOW - 1700000000))
          if [ "$UPDATE_VERSION_CODE" -lt 70 ]; then UPDATE_VERSION_CODE=70; fi
          echo "$UPDATE_VERSION_CODE" | tee update-version-code.txt

          set +e
          ./gradlew :app:assembleRelease \
            -PversionCode="$UPDATE_VERSION_CODE" \
            --console=plain --warning-mode all > assemble-build.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "===== REAL BUILD ERRORS ====="
            grep -n -E "(^|[[:space:]])error:|^ERROR:|AAPT:|Android resource linking failed|cannot find symbol|method .* cannot be applied|Execution failed for task|What went wrong|Release signing is not configured" assemble-build.log | head -120 || true
            echo "===== CONTEXT AROUND FIRST REAL ERROR ====="
            FIRST=$(grep -n -m1 -E "(^|[[:space:]])error:|^ERROR:|AAPT:|Android resource linking failed|cannot find symbol|method .* cannot be applied|Execution failed for task|What went wrong|Release signing is not configured" assemble-build.log | cut -d: -f1)
            if [ -n "$FIRST" ]; then
              START=$((FIRST>15 ? FIRST-15 : 1))
              END=$((FIRST+65))
              sed -n "${START},${END}p" assemble-build.log
            else
              tail -220 assemble-build.log
            fi
            exit "$STATUS"
          fi
          tail -100 assemble-build.log

      - name: Unit tests
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android lint report
        script: |
          cd "$CM_BUILD_DIR"
          set +e
          ./gradlew :app:lintRelease --console=plain > lint-build.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "===== LINT FINDINGS (NON-BLOCKING) ====="
            grep -n -E "^.+:[0-9]+: (Error|Warning):|^ERROR:|AAPT:|Android resource linking failed" lint-build.log | head -160 || true
            tail -80 lint-build.log
          else
            tail -80 lint-build.log
          fi
          exit 0
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/**/*.apk
      - app/build/reports/lint-results-release.html
      - app/build/reports/tests/testDebugUnitTest/**
      - assemble-build.log
      - lint-build.log
      - signing-fingerprint.txt
      - update-version-code.txt
